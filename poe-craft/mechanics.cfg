cost.harvest.addremove.cold = 15000 Vivid Crystallised Lifeforce; 1 Sacred Crystallised Lifeforce
cost.harvest.addremove.lightning = 15000 Primal Crystallised Lifeforce; 1 Sacred Crystallised Lifeforce
cost.harvest.addremove.physical = 15000 Vivid Crystallised Lifeforce; 1 Sacred Crystallised Lifeforce
cost.harvest.addremove.life = 17500 Wild Crystallised Lifeforce; 1 Sacred Crystallised Lifeforce
cost.harvest.addremove.defence = 17500 Primal Crystallised Lifeforce; 1 Sacred Crystallised Lifeforce
cost.harvest.addremove.chaos = 17500 Vivid Crystallised Lifeforce; 1 Sacred Crystallised Lifeforce
cost.harvest.addremove.attack = 17500 Wild Crystallised Lifeforce; 1 Sacred Crystallised Lifeforce
cost.harvest.addremove.caster = 17500 Primal Crystallised Lifeforce; 1 Sacred Crystallised Lifeforce
cost.harvest.addremove.speed = 20000 Vivid Crystallised Lifeforce; 1 Sacred Crystallised Lifeforce
cost.harvest.addremove.critical = 20000 Primal Crystallised Lifeforce; 1 Sacred Crystallised Lifeforce
cost.harvest.keep_prefixes = 50 Sacred Crystallised Lifeforce   # removed from game; only if available.keep=1
cost.harvest.keep_suffixes = 50 Sacred Crystallised Lifeforce

# ---------------------------------------------------------------- beastcrafting (A3)
