cost.beast.imprint = 1 Craicic Croaker                  # B06 imprint a Magic item
cost.beast.restore = 1 Eternal Orb                      # use the imprint
cost.beast.prefix_remove_suffix = 1 Farric Wolf Alpha   # B02 add prefix, remove random suffix (rare)
cost.beast.suffix_remove_prefix = 1 Farric Lynx Alpha   # B03 add suffix, remove random prefix (rare)
cost.beast.meta = 1 Wild Bristle Matron                 # B01 random metamod
cost.beast.aspect = 1 Aspect beast                      # B20 aspect suffix (suffix blocker)
beast.meta_outcomes = noattack nocaster lockP lockS multi   # B01 outcomes, uniform (UNVERIFIED)
