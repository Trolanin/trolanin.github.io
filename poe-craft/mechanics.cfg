cost.harvest.tag.attack = 75 Wild Crystallised Lifeforce
cost.harvest.tag.caster = 75 Primal Crystallised Lifeforce
cost.harvest.tag.speed = 150 Vivid Crystallised Lifeforce
cost.harvest.tag.critical = 150 Primal Crystallised Lifeforce
