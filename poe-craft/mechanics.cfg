# ---------------------------------------------------------------- influence (F1-F3)
# Influence exalts: rare with no influence -> adds that influence and one of its mods (F1).
cost.exalt.shaper = 1 Shaper's Exalted Orb
cost.exalt.elder = 1 Elder's Exalted Orb
cost.exalt.crusader = 1 Crusader's Exalted Orb
cost.exalt.redeemer = 1 Redeemer's Exalted Orb
cost.exalt.hunter = 1 Hunter's Exalted Orb
cost.exalt.warlord = 1 Warlord's Exalted Orb
# Awakener's Orb: one influence mod kept from each item, then the rest rerolled. Total mod count
# after the orb (forum: 2 kept + 2-4 new) - defaults to count.rare (F2, UNVERIFIED).
count.awaken = 4:8 5:3 6:1
cost.awaken = 1 Awakener's Orb
cost.dominance = 1 Orb of Dominance                # F3: remove one influence mod, upgrade another

# ---------------------------------------------------------------- eldritch and fractured (F5/F6)
# Eldritch Chaos ignores prefix/suffix locks (A1.4 "I I"); 1 = honour them instead.
eldritch.chaos_honours_locks = 0
# Orb of Conflict: dominance after the orb, weighted. The real odds depend on the implicit tiers;
# not modelled (UNVERIFIED). tie:w is also accepted.
eldritch.conflict_outcomes = exarch:1 eater:1
cost.eldritch.chaos = 1 Eldritch Chaos Orb
cost.eldritch.exalt = 1 Eldritch Exalted Orb
cost.eldritch.annul = 1 Eldritch Orb of Annulment
cost.conflict = 1 Orb of Conflict
cost.fracture = 1 Fracturing Orb

