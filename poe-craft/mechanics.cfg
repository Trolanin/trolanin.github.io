# poe-craft rule constants and cost recipes (read at runtime by poecraft.exe; no recompile needed).
#
# Syntax: one 'key = value' per line; '#' starts a comment; values are space-separated lists.
# Cost recipes:  cost.<what> = <qty> <price name> [; <qty> <price name> ...]
#   price names resolve against build/prices.txt (poe.ninja, via prices.py) and the price.* keys
#   at the bottom (price.* wins). A recipe may also be a plain number = chaos.
# Section references (A1.4 etc.) point into docs/mechanics.md. Entries marked TODO/UNVERIFIED are
# placeholders: fix them here when the doc settles them.

# ---------------------------------------------------------------- mod counts and caps
count.rare = 4:8 5:3 6:1               # rare reroll (chaos/alch/essence/fossil/harvest): total mod count
count.magic = 1:1 2:1                  # transmute/alteration: 1 or 2 mods  TODO verify (docs part B)
cap.rare = 3 3                         # max prefixes, max suffixes
cap.magic = 1 1
crafted.limit = 1                      # crafted mods allowed without the multimod (A1.1)
crafted.limit_multimod = 3             # with "Can have up to 3 Crafted Modifiers" (it counts itself)

# ---------------------------------------------------------------- fossils
fossil.weight_scale = 100              # fossil tag weight w multiplies a matching mod's weight by w/100
# Each fossil affects a mod once (a matching "less/no" tag wins, else its largest "more" tag) (C4).
# How several fossils combine is disputed (C4, UNVERIFIED): multiplicative = product of the
# per-fossil multipliers; additive = "more" bonuses add (x10 + x10 -> x19), "less" still multiply.
fossil.stack = multiplicative          # TODO verify: multiplicative | additive
# Hand rules from compile_pool.py (not in RePoE): Opulent also blocks tagless mods; Sanctified
# x(1 + 0.01*(required_level - 40)), lucky values not tracked. Tangled/Glyphic/Fractured unmodelled.

# ---------------------------------------------------------------- essences (C3)
# Tiers below this (Whispering..Wailing) only work on normal items; tier >= 5 and the specials also
# reforge rares. Low tiers cap the random mods' level at item_level_restriction (35/45/60/75).
essence.rare_min_level = 5

# ---------------------------------------------------------------- metamods (A1.4 / A1.5)
# Rerolls (chaos, alteration, harvest reforges) keep the protected side's existing mods ("R*").
# 1 = the protected side may still receive new mods in its open slots (A1.4 "R*").
meta.locked_side_can_fill = 1
# 1 = the lock metamod itself survives a Chaos reroll (A1.5 'lock_survives_chaos', UNVERIFIED)
meta.lock_survives_chaos = 1
# Scouring removes every non-protected mod incl. the lock (A1.2). Annulment picks uniformly among
# non-protected mods; crafted mods (incl. the lock itself) are legal targets if this is 1.
annul.can_remove_crafted = 1
# Essences and fossils refuse items carrying any outcome-affecting metamod (A1.4 note 1).
meta.blocks_essence_fossil = 1
# Chaos on an item with protected mods: draw N from count.rare, keep the protected mods, fill
# N - protected; if N <= protected nothing new is added (B "Chaos with protected mods", UNVERIFIED).
# Set to 1 to force at least one new mod per reroll instead.
reroll.min_new = 0                     # TODO verify
# Partial locks "1/2 Prefix Modifiers cannot be changed" (3.30): protected mods chosen uniformly
# at craft time (A1.2). The engine treats them as plain crafted mods (no protection) - known gap.

# ---------------------------------------------------------------- harvest (A2)
# harvest:tag:<t>  reforge incl. a <t> mod (first new mod drawn from the <t>-tagged pool, rest normal)
# harvest:more / harvest:less  reforge, mods sharing a group with the old item get weight x mult
# harvest:addremove:<t>  add a <t> mod then remove another random (non-protected) mod
# Reforge-keeping-prefixes/suffixes were removed from the game (A2.1); keep this 0.
harvest.available.keep = 0
# "more/less likely": mods sharing a mod group with the old item get weight x mult. x90 is the
# Craft of Exile FAQ figure (Harvest datamine); maxroll says x10. less = 1/90 is UNVERIFIED (A2.4).
harvest.same_type_more_mult = 90
harvest.same_type_less_mult = 0.0111111
# CoE FAQ: "more likely" never ends with fewer mods than before (very rarely more). less: UNVERIFIED.
harvest.more_keeps_count = 1
harvest.less_keeps_count = 0
# Randomise influence: new influence set drawn uniformly among sets of the same size the base can
# take; 1 = the current set is excluded (UNVERIFIED, F4).
harvest.randomise_influence.exclude_current = 0
cost.harvest.influence = 5000 Primal Crystallised Lifeforce; 1 Sacred Crystallised Lifeforce
cost.harvest.randomise_influence = 1000 Primal Crystallised Lifeforce
# tag aliases: harvest name -> mod tag in mods.json implicit_tags
harvest.tagalias.defence = defences
cost.harvest.tag.fire = 50 Wild Crystallised Lifeforce
cost.harvest.tag.cold = 50 Vivid Crystallised Lifeforce
cost.harvest.tag.lightning = 50 Primal Crystallised Lifeforce
cost.harvest.tag.physical = 50 Vivid Crystallised Lifeforce
cost.harvest.tag.life = 75 Wild Crystallised Lifeforce
cost.harvest.tag.defence = 75 Primal Crystallised Lifeforce
