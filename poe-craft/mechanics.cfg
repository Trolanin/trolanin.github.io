cost.harvest.tag.attribute = 200 Vivid Crystallised Lifeforce; 2 Crystallised Rancour
cost.harvest.tag.mana = 200 Primal Crystallised Lifeforce; 2 Crystallised Rancour
cost.harvest.tag.drop = 200 Vivid Crystallised Lifeforce; 1 Crystallised Rancour
