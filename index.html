<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trolanin's projects</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --fg: #1b1f24; --muted: #5b6470; --line: #dde1e6; --accent: #0f9d7a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1216; --card: #171b21; --fg: #e6e9ed; --muted: #9aa3ad; --line: #2a3038; --accent: #3ddc97; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 1.15rem; margin: 0 0 6px; }
  .card p { margin: 0 0 14px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  .links a { color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
  .links a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Projects</h1>
  <p class="sub">Tools that run right in the browser. Nothing to install.</p>

  <section class="card">
    <h2>LED designer &amp; simulator</h2>
    <p>Design music-reactive light shows for ESP32 addressable LED strips, preview them live, and download the FastLED sketch to flash.</p>
    <div class="links">
      <a href="led-sim/designer.html">Open the designer</a>
      <a href="led-sim/">Open the simulator</a>
      <a href="led-sim/android.html">Android audio app</a>
      <a href="https://github.com/Trolanin/trolanin.github.io/tree/main/led-sim">Source &amp; read me</a>
    </div>
  </section>
</main>
</body>
</html>
