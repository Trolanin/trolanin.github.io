# Builds drift-viz/drift.apk (Drift for Android) on GitHub's servers and commits it back to the branch,
# for when the PC isn't around. Same steps as drift-viz/android/build-apk.ps1 (plain SDK tools, no Gradle).
# It signs with a throwaway key made fresh each run, so a phone must uninstall this build before
# installing one signed by the PC's real key (and between two CI builds).
name: Drift APK
on:
  push:
    branches: ['claude/music-visualizer-android-**']
    paths: ['drift-viz/android/**', '.github/workflows/drift-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" > /dev/null
      - name: Build
        run: |
          set -e
          bt="$ANDROID_HOME/build-tools/36.1.0"; jar="$ANDROID_HOME/platforms/android-36/android.jar"
          here=drift-viz/android; out=$RUNNER_TEMP/b; mkdir -p $out/gen $out/classes $out/dex
          "$bt/aapt2" compile --dir $here/res -o $out/res.zip
          "$bt/aapt2" link -I "$jar" --manifest $here/AndroidManifest.xml -o $out/base.apk --java $out/gen $out/res.zip
          javac -source 8 -target 8 -Xlint:-options -Xlint:deprecation -encoding UTF-8 -bootclasspath "$jar" -d $out/classes \
            $(find $here/src $out/gen -name '*.java')
          "$bt/d8" --release --min-api 29 --lib "$jar" --output $out/dex $(find $out/classes -name '*.class')
          (cd $out/dex && zip -q ../base.apk classes.dex)
          "$bt/zipalign" -f -p 4 $out/base.apk $out/aligned.apk
          keytool -genkeypair -keystore $out/ci.jks -alias drift -keyalg RSA -keysize 2048 -validity 365 \
            -storepass cibuild -keypass cibuild -dname 'CN=Drift CI build' > /dev/null
          "$bt/apksigner" sign --ks $out/ci.jks --ks-key-alias drift --ks-pass pass:cibuild --key-pass pass:cibuild \
            --out drift-viz/drift.apk $out/aligned.apk
          "$bt/apksigner" verify drift-viz/drift.apk
          rm -f drift-viz/drift.apk.idsig
          ls -la drift-viz/drift.apk
      - name: Commit the APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drift-viz/drift.apk
          git commit -m "Drift for Android: CI build of drift.apk (throwaway signing key)" || exit 0
          git push
