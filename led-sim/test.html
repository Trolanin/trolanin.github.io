  int k = 0; do { k += 3; } while (k < 10); Serial.println(k);
  int w = 0; while (true) { if (++w > 4) break; } Serial.println(w);
}`, '6\nzero,low,many\n12\n5\n'],
['structs are values', `

  P b = a; b.x = 5; b.c.g = 200;

  bump(a); Serial.println(a.x);

['CRGB semantics', `
CRGB leds[8];
void setup() {
  leds[0] = CRGB::Red; leds[1] = leds[0]; leds[1].g = 9;
  Serial.println(leds[0].g);
  leds[0] += CRGB(10, 250, 0); Serial.println(leds[0].r); Serial.println(leds[0].g);
  leds[2] = 0x102030; Serial.println(leds[2].b);
  leds[2] %= 128; Serial.println(leds[2].b);
  leds[3] = CHSV(0, 255, 255); Serial.println(leds[3].r);
  if (leds[4]) Serial.println("lit"); else Serial.println("dark");
  if (leds[0] == CRGB(255, 250, 0)) Serial.println("eq");
  leds[5].setRGB(300, 2, 3); Serial.println(leds[5].r);
  CRGB c = leds[2]; c.r = 200; Serial.println(leds[2].r);
  fill_solid(leds + 6, 2, CRGB::Blue); Serial.println(leds[5].b); Serial.println(leds[7].b);
  CRGB *p = &leds[6]; p[1] = CRGB::Green; Serial.println(leds[7].g);
  Serial.println(sizeof(leds) / sizeof(leds[0]));
  leds[1].r += 10; Serial.println(leds[1].r);
  leds[random8(8)] |= CHSV(10, 20, 30);
}`, '0\n255\n250\n48\n25\n255\ndark\neq\n44\n9\n3\n255\n128\n8\n9\n'],
['classes, ctors, methods, enums', `
enum Color { RED, GREEN = 5, BLUE };
enum class Mode : uint8_t { Off, On };
class Counter {
  public:
    Counter(int start, int step = 2) : value(start), step(step) {}
    void tick() { value += step; total++; }

    int value; int step;

int Counter::total = 0;

Blinker::Blinker() : state(false) {}

  Serial.println(BLUE); Serial.println((int)Mode::On);
  bl.flip(); Serial.println(bl.state);
  Mode m = Mode::On; if (m == Mode::On) Serial.println("on");

['overloads, defaults, fn pointers, arrays', `
int twice(int a) { return a * 2; }
float twice(float a, float b) { return a * b * 2; }

#define COUNT(a) (sizeof(a) / sizeof(a[0]))

  Serial.println(twice(4)); Serial.println(twice(1.5, 2.0)); Serial.println(add(1)); Serial.println(add(1, 2));

  Serial.println(map(512, 0, 1023, 0, 255)); Serial.println(constrain(300, 0, 255));
  Serial.println((uint8_t)300); Serial.println(1 << 4 | 3); Serial.println(0xFF & ~0x0F);
  Serial.println('A'); Serial.println((int)'A'); Serial.println(3.14159, 3);

['palettes & helpers', `
CRGB leds[16];
CRGBPalette16 pal = RainbowColors_p;
DEFINE_GRADIENT_PALETTE(bw_gp) { 0, 0, 0, 0, 255, 255, 255, 255 };

  pal = CRGBPalette16(CRGB::Black, CRGB::White);

  pal = bw_gp; Serial.println(pal[15].g);
  fill_rainbow(leds, 16, 0, 16); Serial.println(leds[0].r > 200 ? "red" : "no");
  fadeToBlackBy(leds, 16, 255); Serial.println(leds[0].r);
  CRGBArray<8> set; set(0, 3) = CRGB::Blue; set(4, 7).fill_solid(CRGB::Red); Serial.println(set[3].b); Serial.println(set[4].r);
  for (CRGB &px : set) px.nscale8(128);
  Serial.println(set[4].r);
  Serial.println(qadd8(200, 100)); Serial.println(qsub8(5, 10)); Serial.println(scale8(255, 128)); Serial.println(sin8(64)); Serial.println(lerp8by8(0, 100, 128));
}`, '255\n255\n255\nred\n0\n255\n255\n128\n255\n0\n128\n255\n50\n'],
];

function runSketch(code, stopAt) {
  return new Promise((resolve) => {
    const r = { serial: '', frames: 0, peak: 0, n: 0, error: null, line: 0, warn: [] };
    let js;
    try { js = LEDSim.compile(code).js; }
    catch (e) { r.error = 'COMPILE: ' + e.message; r.line = e.line || 0; resolve(r); return; }
    const host = {
      post(m) {
        if (m.type === 'serial') r.serial += m.text;
        else if (m.type === 'frame') { r.frames++; r.n = m.n; for (const v of m.buf) if (v > r.peak) r.peak = v; }
        else if (m.type === 'warn') r.warn.push(m.message);
        else if (m.type === 'error') { r.error = m.message; r.line = m.line; r.js = js; resolve(r); }
        else if (m.type === 'done') resolve(r);
      },
      onmessage: null,
    };
    try { LED_RUNTIME(host); host.onmessage({ type: 'run', code: js + '\n//# sourceURL=sketch.ino', speed: 400, stopAt }); }
    catch (e) { r.error = 'HOST: ' + e.message; resolve(r); }
    setTimeout(() => { if (!r.error) { r.error = 'TIMEOUT'; resolve(r); } }, 8000);
  });
}

(async function () {
  const lines = [];
  let fails = 0;
  for (const [name, code, expect] of UNIT) {
    const r = await runSketch(code, 400);
    const ok = !r.error && r.serial === expect;
    if (!ok) fails++;
    lines.push((ok ? 'PASS ' : 'FAIL ') + name + (r.error ? `  [${r.error} @ line ${r.line}]` : ''));
    if (!ok) {
      lines.push('  expected: ' + JSON.stringify(expect));
      lines.push('  actual:   ' + JSON.stringify(r.serial));
      if (r.js && r.line) lines.push('  js: ' + (r.js.split('\n')[r.line - 1] || '').slice(0, 600));
    }
  }
  for (const ex of LED_EXAMPLES) {
    const r = await runSketch(ex.code, 9000);
    // With no led-audio frames, the audio example only shows its dim "no link" breathing.
    const minPeak = /led-audio/.test(ex.name) ? 1 : 15;
    const ok = !r.error && r.frames > 3 && r.peak >= minPeak && r.n === 60 && !r.warn.length;
    if (!ok) fails++;
    lines.push((ok ? 'PASS ' : 'FAIL ') + 'example: ' + ex.name + `  frames=${r.frames} peak=${r.peak} n=${r.n}` +
      (r.error ? `  [${r.error} @ line ${r.line}]` : '') + (r.warn.length ? '  warn=' + r.warn.join('|') : '') + (r.serial ? '  serial=' + JSON.stringify(r.serial.slice(0, 90)) : ''));
    if (r.js && r.line) lines.push('  js: ' + (r.js.split('\n')[r.line - 1] || '').slice(0, 600));
  }
  lines.push(fails ? `${fails} FAILED` : 'ALL PASSED');
  document.getElementById('out').textContent = lines.join('\n');
  document.title = 'done';
})();
</script>
